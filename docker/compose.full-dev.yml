# OPT-IN overlay. Must be used *with* docker/compose.dev.yml.
# It does not redefine postgres, its volume, ports, or healthcheck.
services:
  api:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
      target: api-dev
    environment:
      NODE_ENV: development
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: ${COMMERCE_DOCKER_DATABASE_URL:?Generate docker/.env.full using scripts/ec015-2-prepare-env.mjs}
      AUTH_JWT_SECRET: ${COMMERCE_AUTH_JWT_SECRET:?Generate docker/.env.full}
      AUTH_CSRF_SECRET: ${COMMERCE_AUTH_CSRF_SECRET:?Generate docker/.env.full}
      CORS_ORIGIN: http://127.0.0.1:5173
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../apps/api/src:/workspace/apps/api/src
      - ../apps/api/prisma:/workspace/apps/api/prisma:ro
      - ../apps/api/docs:/workspace/apps/api/docs:ro
      - commerce_api_generated:/workspace/apps/api/src/generated/prisma
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  web:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
      target: web-dev
    environment:
      COMMERCE_DOCKER_DEV: "1"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../apps/web/src:/workspace/apps/web/src
      - ../apps/web/index.html:/workspace/apps/web/index.html:ro
      - ../apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  commerce_api_generated:
