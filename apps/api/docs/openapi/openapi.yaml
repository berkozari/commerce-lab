openapi: 3.1.0
info:
  title: CommerceLab API
  version: 0.2.0
  description: Cookie-based authentication. Obtain a CSRF token before every state-changing request.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /health:
    get:
      tags: [Health]
      responses:
        '200':
          description: Application is running
  /health/live:
    get:
      tags: [Health]
      responses:
        '200':
          description: Process liveness
  /health/ready:
    get:
      tags: [Health]
      responses:
        '200':
          description: Database connected
        '503':
          description: Database unavailable
  /auth/csrf:
    get:
      tags: [Authentication]
      summary: Issue a signed CSRF token and readable CSRF cookie
      responses:
        '200':
          description: Returns data.csrfToken
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer and issue session cookies
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Customer created
        '400':
          description: Invalid input
        '403':
          description: Invalid CSRF token
        '409':
          description: Email already registered
        '429':
          description: Too many attempts
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate with email and password
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
        '403':
          description: Invalid CSRF token
        '429':
          description: Too many attempts
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue new access cookie
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Tokens refreshed
        '401':
          description: Invalid, expired or revoked session
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke current refresh session
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Cookies cleared and session revoked if present
  /auth/logout-all:
    post:
      tags: [Authentication]
      summary: Revoke all sessions of authenticated user
      security:
        - accessCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: All sessions revoked
        '401':
          description: Authentication required
  /auth/me:
    get:
      tags: [Authentication]
      summary: Retrieve authenticated user
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current user, excluding password hash
        '401':
          description: Authentication required
  /categories:
    get:
      tags: [Catalog]
      summary: List categories
      parameters:
        - name: parentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Categories }
  /products:
    get:
      tags: [Catalog]
      summary: List active products (paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, name-asc, name-desc] } }
      responses:
        '200': { description: Paginated active products }
        '400': { description: Invalid query }
  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Get active product by slug
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Public product with active variants }
        '404': { description: Not found or unpublished }
  /admin/products:
    get:
      tags: [Catalog Admin]
      summary: List products including drafts and archived
      security: [{ accessCookie: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] } }
      responses:
        '200': { description: Products }
        '403': { description: Admin role required }
    post:
      tags: [Catalog Admin]
      summary: Create a DRAFT product
      security: [{ accessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, name, slug]
              properties:
                categoryId: { type: string, format: uuid }
                name: { type: string }
                slug: { type: string }
                description: { type: [string, 'null'] }
                status: { type: string, const: DRAFT }
      responses:
        '201': { description: Created }
  /admin/products/{id}:
    get:
      tags: [Catalog Admin]
      security: [{ accessCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Product details }
    patch:
      tags: [Catalog Admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 'Partial product fields, including status' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Catalog Admin]
      summary: Archive instead of hard deletion
      security: [{ accessCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200': { description: Archived }
  /admin/categories:
    post:
      tags: [Catalog Admin]
      summary: Create category
      security: [{ accessCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, slug], properties: { name: { type: string }, slug: { type: string }, parentId: { type: [string, 'null'], format: uuid } } }
      responses:
        '201': { description: Created }
  /admin/categories/{id}:
    patch:
      tags: [Catalog Admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Partial category fields }
      responses:
        '200': { description: Updated }
  /admin/products/{id}/variants:
    post:
      tags: [Catalog Admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sku, name, price], properties: { sku: { type: string }, name: { type: string }, price: { type: string, example: '129.99' }, quantity: { type: integer, minimum: 0 } } }
      responses:
        '201': { description: Variant and inventory created }
  /admin/products/{id}/variants/{variantId}:
    patch:
      tags: [Catalog Admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Partial variant fields }
      responses:
        '200': { description: Updated }
  /admin/products/{id}/images:
    post:
      tags: [Catalog Admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string, format: uri }, altText: { type: string }, position: { type: integer, minimum: 0 } } }
      responses:
        '201': { description: Added }
  /admin/products/{id}/images/{imageId}:
    patch:
      tags: [Catalog Admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Partial image fields }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Catalog Admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200': { description: Deleted }
  /admin/inventory/{variantId}:
    patch:
      tags: [Catalog Admin]
      security: [{ accessCookie: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 0 } } }
      responses:
        '200': { description: Inventory updated }
  /cart:
    get:
      tags: [Cart]
      summary: Get or initialize the authenticated user or guest cart
      responses:
        '200': { description: Cart snapshot with decimal string totals }
        '401': { description: Invalid access session }
    delete:
      tags: [Cart]
      summary: Remove all items from the active cart
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200': { description: Cleared cart }
        '403': { description: Invalid CSRF token }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add quantity to an existing cart line or create a new line
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variantId, quantity]
              properties:
                variantId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '201': { description: Updated cart }
        '400': { description: Validation failed }
        '409': { description: Variant unavailable or insufficient stock }
  /cart/items/{itemId}:
    patch:
      tags: [Cart]
      summary: Set absolute quantity for an item in current cart
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [quantity], properties: { quantity: { type: integer, minimum: 1, maximum: 100 } } }
      responses:
        '200': { description: Updated cart }
        '404': { description: Item not found in this cart }
        '409': { description: Insufficient stock }
    delete:
      tags: [Cart]
      summary: Remove a line from the current cart
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200': { description: Updated cart }
        '404': { description: Item not found in this cart }
  /cart/merge:
    post:
      tags: [Cart]
      summary: Merge the guest cart into the authenticated user cart atomically
      security: [{ accessCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200': { description: Merged cart; guest cookie cleared }
        '401': { description: Authentication required }
        '409': { description: Insufficient stock or item limit; original carts unchanged }
components:
  parameters:
    CsrfHeader:
      name: x-csrf-token
      in: header
      required: true
      description: Value returned by GET /auth/csrf, paired with cl_csrf cookie
      schema:
        type: string
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: cl_access
  schemas:
    RegisterInput:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
